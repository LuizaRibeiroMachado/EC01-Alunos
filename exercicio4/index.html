<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Exercício 4</title>
</head>
<body>
    <h1>DevTech Academy</h1>
    <h2>Exercício 4 - Relatórios com filter, map, reduce, sort</h2>
    <p><a href="../index.html">Voltar ao início</a></p>

    <!-- Formulário de cadastro (HTML puro, sem CSS) -->
    <form id="formAluno">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </p>
        <p>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1">
        </p>
        <p>
            <label for="curso">Curso:</label>
            <select id="curso">
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </p>
        <p>
            <label for="notaFinal">Nota Final:</label>
            <input type="number" id="notaFinal" min="0" max="10" step="0.1">
        </p>
        <p>
            <button type="button" id="btnCadastrar">Cadastrar</button>
            <button type="button" id="btnCancelar" hidden>Cancelar</button>
        </p>
    </form>

    <h2>Alunos cadastrados</h2>
    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
    </table>

    <!-- Seção de relatórios -->
    <h2>Relatórios</h2>
    <p>
        <button type="button" id="btnAprovados">Alunos aprovados</button>
        <button type="button" id="btnMediaNotas">Média das notas finais</button>
        <button type="button" id="btnMediaIdades">Média das idades</button>
        <button type="button" id="btnOrdemAlfabetica">Nomes em ordem alfabética</button>
        <button type="button" id="btnPorCurso">Quantidade de alunos por curso</button>
    </p>
    <div id="relatorio">
        <p>Escolha um relatório acima.</p>
    </div>

    <!-- A classe Aluno precisa ser carregada antes do script principal -->
    <script src="aluno.js"></script>
    <script src="script.js"></script>
</body>
</html>
